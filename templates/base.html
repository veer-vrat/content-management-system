<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Veervrat CMS{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
  <span></span><span></span><span></span>
</button>
<div class="nav-backdrop" id="navBackdrop"></div>
<div class="app">
  <nav id="mainNav">
    <div class="brand">
      <small>Veervrat</small>
      Content CMS
    </div>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Data Model</a>
    <div class="nav-section">Content</div>
    <a href="/virtues" class="{% if '/virtues' in request.url.path %}active{% endif %}">Virtues</a>
    <a href="/subvirtues" class="{% if '/subvirtues' in request.url.path %}active{% endif %}">Subvirtues</a>
    <a href="/weaknesses" class="{% if '/weaknesses' in request.url.path %}active{% endif %}">Weaknesses</a>
    <a href="/sentences" class="{% if '/sentences' in request.url.path %}active{% endif %}">Sentences</a>
  </nav>
  <main>
    {% if msg %}
    <div class="flash">{{ msg }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
<script>
  const toggle = document.getElementById('navToggle');
  const backdrop = document.getElementById('navBackdrop');
  function closeNav() { document.body.classList.remove('nav-open'); }
  toggle.addEventListener('click', () => document.body.classList.toggle('nav-open'));
  backdrop.addEventListener('click', closeNav);
  document.querySelectorAll('#mainNav a').forEach(a => a.addEventListener('click', closeNav));
</script>
</body>
</html>
