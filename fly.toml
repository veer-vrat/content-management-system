# fly.toml app configuration file generated for veervrat-cms on 2026-05-30T19:16:30+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'veervrat-cms'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  DB_PATH = "/data/veervrat_cms.db"

[[mounts]]
  source = "cms_data"
  destination = "/data"
